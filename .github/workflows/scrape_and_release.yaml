name: Scrape and Release

on:
  schedule:
    # Every week
    # 10:47 AM UTC every day (3:47 AM pacific time)
    # There should be little APOC filing activity and low load on githubs servers.
    - cron: "47 10 * * *"
  workflow_dispatch:

# Needed for creating releases.
permissions:
  contents: write

jobs:
  scrape_and_release:
    name: Scrape and Upload Release
    runs-on: ubuntu-latest
    # A healthy run takes ~30 min, but some runs in election season 2026 were taking 90.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Scrape Data
        run: >
          uv run apoc-data scrape --directory scraped
          --attempts 6 --retry-backoff 8 --trace-dir traces

      # A trace is written for every failed *attempt*, and with --attempts 6
      # some failures are routine, so expect this to be non-empty on plenty of
      # runs that ultimately succeeded. `playwright show-trace <file>` replays
      # the DOM, screenshots and network activity at the moment things broke.
      - name: Upload failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: traces/
          if-no-files-found: ignore
          retention-days: 14

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release.sh
